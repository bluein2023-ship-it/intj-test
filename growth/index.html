splay:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:16px;background:var(--panel);border-radius:17px;border:1px solid var(--line)}.tile p{margin:0;color:var(--muted);font-size:.9rem}.tile .dot{display:block;margin-bottom:7px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--color);flex:none}.foot{padding:10px 0 28px}.reader{max-width:710px;margin:24px auto 0}.progress{height:9px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 20px}.progress span{height:100%;display:block;background:var(--accent);border-radius:99px}.qhead{font-size:clamp(1.35rem,4vw,2rem);margin-bottom:21px}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:14px;border-radius:17px;margin:10px 0;min-height:64px}.choice[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.letter{flex:0 0 33px;height:33px;display:grid;place-items:center;border-radius:50%;background:var(--card);font-weight:800}.actions,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{margin-top:22px}.row{flex-wrap:wrap}.rings{max-width:260px;width:100%;margin:auto;display:block}.rings text{font-family:inherit;fill:var(--ink)}.columns{height:172px;display:flex;justify-content:center;align-items:stretch;gap:clamp(8px,3vw,25px);padding:4px 12px 0}.column{display:grid;grid-template-rows:1fr 25px;gap:6px;flex:1;max-width:55px;text-align:center}.column-track{height:100%;border-radius:16px;background:var(--track);display:flex;align-items:end;overflow:hidden}.column-fill{width:100%;border-radius:16px;background:var(--color)}.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:25px;align-items:center}.total{font-size:clamp(3rem,9vw,5rem);font-weight:850;line-height:1.05;letter-spacing:-.07em}.total small{font-size:1.25rem;letter-spacing:0;color:var(--muted)}.pill{disp <script id="dataset" type="application/json">{"headline": "把计划做实，\n也留出别的路。", "about": "借用 MBTI 类型动力学中的 INTJ 视角，用朋友相处、一起做事和计划临时变化等日常情景，观察你如何判断、执行、表达价值和现场调整。", "benefit": "看见你擅长的决策与执行方式，并发现什么时候可以多问一句、多想一个备选，或把眼前的新信息用起来。", "labels": ["判断与验证", "价值与边界", "组织与执行", "现场观察与应变", "切换视角与综合调整"], "codes": ["Ni", "Fi", "Te", "Se", "综合"], "keys": ["210", "102", "021", "120", "210", "012", "120", "210", "012", "210", "021", "210", "012", "201", "012", "120", "201", "210", "120", "022", "120", "210", "012", "021", "201", "012", "120", "210", "021", "210", "021", "210", "102", "210", "021", "102", "210", "210", "021", "210", "120", "201", "102", "021", "201", "012", "021", "201", "012", "120"], "notes": [["检查最初的假设，可以省下按错误方向做事的时间。", "先写下你最有把握的解释，再找一条可能推翻它的信息。", "用一个小对照试验，每次只改一个条件。"], ["说清自己在意的事，能帮助对方理解你的选择，也让约定更好落实。", "先用一句话说清自己的偏好，再给一个可接受的备选。", "如果对方说自己表现差，先问对方想听建议还是先继续。"], ["把限制和下一步说清楚，可以减少等待和重复分工。", "约不下来时，给两个可选时间，再写下默认安排。", "多人一起做事时，列出剩下的任务，让大家认领。"], ["先看眼前的条件再调整，可以节省试错和返工。", "先找现场的提示、样品或可用工具，再决定要不要重来。", "用一个可撤回的小动作试备用方案，再扩大改动。"], ["根据对方的需要和现场线索切换做法，会让原本卡住的事情有更多出路。", "先问“你想先聊聊，还是一起找个替代方案？”", "同时想一个保持原目标的备选，和一个改变活动形式的备选。"]], "kind": "intj", "name": "INTJ", "questions": [["你和朋友连续两次下午去一家店，两次都排了半小时。下周还想去。", "查一下周末和工作日的排队时段，再选出发时间。", "提前半小时到，给排队留时间。", "认定这家一直要排半小时，以后都按这个时间算。"], ["你发现最近三次都忘了带水杯，其中两次是临时改了出门时间。", "在原来的出门时间设一个提醒。", "觉得自己最近记性差，下次出门时努力想一遍。", "看看三次忘带前有没有同一个动作被打断，再决定在哪一步提醒。"], ["一起玩的游戏总在同一关输。上一局你们换了角色，也换了路线。", "认定新角色不好用，下局直接换回去。", "下局只换回路线，看看失败的位置有没有变化。", "把角色和路线都换回以前的组合，先打一局看看。"], ["你和朋友约三点在门口见。三点十分，他还没到，只发了一句“快了”。", "回“好”，再等十分钟看看。", "问还要几分钟，好决定是在门口等，还是先进去。", "回“你到了叫我”，先进去逛。"], ["你照着短视频折纸，折到第三步，手上的纸和画面里的方向对不上。", "暂停画面，对照折痕和纸角，找是哪一步转错了方向。", "从头再折一张，这次把视频调慢。", "按自己猜的方向先折下一步，看能不能接上。"], ["四个人选电影。三个人都说“随便”，你发了两个片名，五分钟没人选。", "定自己想看的那部，把片名发到群里。", "再发一部，看看有没有人对新选项感兴趣。", "发一句“喜剧和动画二选一，八点前没回我就先选喜剧”。"], ["你连续三次出门都比预计晚十分钟。下次还是走同一条路。", "把出门提醒提前十分钟。", "分别记下开始收拾、出门和到达的时间，看时间花在哪。", "维持原来的出门时间，路上走快一点。"], ["两个人一起拼图。你想先拼边框，对方已经开始按颜色分。", "各用自己的方法先拼五分钟，看看能不能分工。", "先跟着对方按颜色分，拼不动时再换。", "请对方先放下手里的颜色组，跟你一起拼边框。"], ["你看了两个说“早去人少”的视频，后来发现它们都是去年拍的。", "还是按视频里的时间出发。", "把出发时间再提前一点，给排队留余量。", "看看最近一周有没有同一时段的到访记录，再决定几点出门。"], ["你给三盆植物按同样的频率浇水，只有窗边那盆总在两天后变干。", "比较三盆的光照和土的干湿，再决定只调整哪一盆。", "下次给窗边那盆多浇一点，看看能撑几天。", "把三盆都改成隔天浇水。"], ["两位朋友选了很吵的店，你更想找个能听清彼此说话的地方。三人还没出发。", "先答应去那家，到了觉得太吵再提。", "说“我今天更想找个能聊天的地方”，提议去附近另一家。", "问“能不能换一家？”等对方问起再说原因。"], ["朋友想把你拍得不自在的一张合照发到群里，另外还有两张合照。", "说“这张我不想发，另外两张都可以”。", "说“换一张吧”，看看朋友选哪张。", "说“你决定吧”，发出后再考虑要不要请他删。"], ["你答应陪朋友散步，家人临时邀你在同一时间看一场你很想看的演出。", "先答应去看演出，再告诉朋友散步取消。", "按原约定去散步，直接谢绝演出。", "先问朋友改到另一时段是否方便，等他答复再决定要不要去看演出。"], ["你把东西借给家人，说好今晚拿回来。对方想再用一天，但你明早就要用。", "说“我明早要用，今晚九点前得拿回来”，问对方几点方便还。", "先同意多借一天，明早再想办法。", "告诉对方你明早要用，问他今晚能不能还。"], ["朋友玩游戏连输两局，说“我玩得真烂”。你看出他总在同一处失误。", "马上告诉他失误在哪，下一局应该怎么改。", "说“这关确实容易卡”，照常准备下一局。", "说“我看到一处可能能帮你。你想听一下，还是先玩下一局？”"], ["朋友把你私下讲给他的糗事说给了别人。散场后你们可以单独说话。", "说“刚才那个笑话让我不太舒服”，看看他怎么回应。", "说“那件事我是私下告诉你的。以后要讲给别人，先问我一下。”", "先略过这件事，以后少跟他讲自己的事。"], ["别人夸你独自做完了一张海报，其实朋友也画了其中一部分。", "当场指出朋友做了哪一部分，再谢谢对方。", "先收下夸奖，过后私下感谢朋友。", "当场说“其实有朋友一起做”，继续原来的话题。"], ["你和朋友约好散步，出门时开始下小雨，附近有一段带顶棚的路。", "提议走有顶棚的那段，见面后看雨势再决定走多远。", "发消息问还走不走，等朋友决定。", "先照原路线走，到了再看哪里能避雨。"], ["两个人合买一包零食，你想试新口味，对方想买平时那种。", "选平时那种，这次先省下讨论时间。", "提议这次选对方的口味，下次轮到你时试新的。", "坚持买新的，觉得吃过的口味下次也能买。"], ["大家想把一张截图转发到别的群，截图里有朋友的私聊内容。", "先转发，朋友介意时再撤回。", "先问朋友愿不愿意让这段私聊被转发。", "建议把想分享的信息重新写一遍，删去私聊原话和能认出当事人的细节。"], ["三个人约周末出门，一人只能上午，一人最多待两小时。", "先约最早能碰面的时间，活动当天再定。", "找一段都能参加的时间，发一个两小时内能走完的安排。", "先发自己想去的三个地点，让大家各自报能待多久。"], ["四个人一起做一顿简单的饭，菜洗了两遍，米还没人煮。", "自己把米煮上，再说清剩下两件事各由谁做。", "自己先把米煮上，其他人做什么等会儿再看。", "提醒大家“别重复做”，继续做手上的事。"], ["你们借来的游戏晚上八点要还，离结束还有三局，七点半还有人要先走。", "按原来的局数继续，快到八点再看能不能打完。", "每局都玩快一点，争取按时结束。", "先约定七点半前打完一局，再看剩下的人要不要加赛。"], ["两个人想买一件共用物品，一件便宜但只能自取，一件贵些能送到家。", "选便宜的，下单后再想怎么取。", "把来回路费、取货时间和到手日期放在一起比。", "先问对方哪天能取，再比较两件的标价。"], ["群里说好每个人带一样东西，第二天就要见面，名单上有两个人写了同一种饮料。", "问其中一人能不能换成还没人带的纸杯，然后发更新后的名单。", "在群里说饮料重复了，请大家自己看着调整。", "自己到时候多带点纸杯，名单先照旧。"], ["你们要从三条散步路线里选一条，一人只能走半小时，一人想拍照。", "先选照片最好看的路线，到时间再折返。", "选最短的路线，到了再看有没有能拍的地方。", "先筛掉半小时走不完的路线，再在剩下的里选有拍照点的。"], ["你要把一段做法发给朋友。他第一次做，上次看到长消息只记住了第一步。", "发完整说明，把第一步加粗。", "先发现在要做的两步和一张示意图，请他做完回个消息。", "把上次的原文再发一遍，请他这次仔细读。"], ["大家约好今晚各选五张照片做相册，已经十点，只有两个人交了。", "先告诉大家第一版会用已交的照片，明天中午前还能补，再开始做。", "先用已交的照片做两页，明天再问剩下的人。", "等大家全部交齐，再开始做。"], ["同一套游戏规则你讲了两遍，大家还是在同一个地方停下来争论。", "把规则再从头讲一遍。", "找出那条有争议的规则，拿眼前这一局走一遍给大家看。", "先由你决定这一局怎么算，结束后再解释。"], ["你们约好各带一道吃的，有人当天才说他不能吃其中一种食材。", "先确认哪些现成食物符合他的限制，再商量缺的那一份怎么补。", "请他先吃自己确定能吃的东西，到了再看看。", "按原安排带食物，到场后请他自己挑。"], ["到了球场才发现正在维修，旁边有块空地，也带了跳绳。", "在原地等一会儿，看球场会不会开放。", "改去空地跳绳，先看地面和空间是否合适。", "先找下一个球场，走过去看看开没开。"], ["你准备把一张纸贴在墙上，胶带一贴就翘，桌上还有夹子和绳子。", "用夹子和绳子先试挂一个角，看能不能固定。", "换一段更长的胶带，贴两层再试。", "继续用原来的胶带，把翘起的地方多按几次。"], ["沿着地图走到公园侧门，发现门锁着，门上贴了开放入口的示意图。", "沿围栏先走一段，看看有没有别的小门。", "在原地等，看看有没有人从里面开门。", "看示意图确认最近的开放入口，再调整路线。"], ["手工做到一半，纸已经剪短了一截，手边还剩一小段同色纸。", "先比一下缺口和余纸的大小，再决定拼接还是改尺寸。", "先把同色纸贴上，再看接缝能不能藏住。", "继续按原尺寸做，最后再处理缺掉的一截。"], ["你们本来要拍一张合照，原位置背光，旁边几步就是阴凉处。", "继续站原处，让拍照的人多拍几张。", "先在阴凉处试拍一张，确认人脸清楚再拍正式照。", "留在原地，请拍照的人先调一下亮度。"], ["你装了一半的小架子开始晃，桌面也有点斜。", "先把已经装上的螺丝都拧紧。", "继续装完，最后再看还晃不晃。", "先移到平地轻推一下，分清是桌面斜还是架子松。"], ["出门前发现手机只剩 5% 电，到约见地点还要换乘一次。", "先截好路线和约见地址，告诉朋友可能没电。", "调成省电模式，换乘时再打开地图。", "一路开着地图，快关机时再看怎么办。"], ["你第一次用一个公共储物柜，扫码后打不开，柜门旁贴着本柜的操作步骤。", "按贴纸核对自己漏了哪一步，再试一次。", "先退出页面，重新扫码。", "连续点几次刚才那个按钮。"], ["你煮的汤尝起来太咸，离开饭还有十分钟。", "按原菜谱继续煮完，上桌后配清淡的食物。", "先舀一小碗试加一点水，味道合适再调整整锅。", "先往整锅里加一些水，再尝味道。"], ["你和朋友打算在户外坐一会儿，原来的座位晒得发烫，旁边有人刚离开一张阴凉长椅。", "先摸一下阴凉长椅是否干净、温度合适，再提议挪过去。", "先站一会儿，看看原座位有没有凉一点。", "把随身物品垫在原座位上，按原计划坐下。"], ["桌游只剩十五分钟，规则写着至少玩半小时。大家都想再玩一轮。", "只缩短每个人的思考时间，其他规则照旧。", "问大家更想保留对抗还是保留完整流程，按答案改成短局。", "按原规则开局，到点直接停。"], ["你问朋友为什么迟到，他沉默了一会儿，说“今天发生了点事”。", "问“你想先说说，还是我们先进去，晚点再聊？”", "接着问“所以到底为什么迟到？”", "先和他进去，等他自己再开口。"], ["上次出门野餐下过小雨，有两样东西弄湿了。这次天气看起来差不多。", "这次多带一件外套。", "按平时的晴天清单收拾，到了再找地方避雨。", "回想上次具体哪两样弄湿了，这次单独装进防水袋。"], ["游戏里有人说“先走的人总能赢”，你们只玩了两局，而且都是同一人先走。", "下局还是让他先走，看看他会不会三连胜。", "让两人交换先后顺序，其他规则照旧。", "让另一人先走，同时换个地图试试。"], ["你挑的电影播了二十分钟，有两个人开始频繁看手机。", "问大家想继续看、换短片，还是关掉聊一会儿。", "继续播放，等有人开口再说。", "先暂停，问大家要不要直接换一部电影。"], ["朋友说“你每次都替我决定”，你记得上次明明问过他。", "立刻举上次的例子，说明他记错了。", "先让他把话说完，再说你记得上次问过。", "先问“你指刚才选路线那次吗？”听清后再说自己的记忆。"], ["你连续两次把钥匙留在另一件外套里，今天出门前又换了外套。", "默念“别忘钥匙”，继续收拾。", "先检查旧口袋，再把钥匙放进每天都带的同一个包。", "先摸一下今天穿的外套口袋，发现没有再去找。"], ["两个人按同一份说明折纸，一个人折成正面，一个人折成反面。两个人都觉得自己照做了。", "各自指给对方看自己把哪一面当作“正面”，再对照第一张图。", "先按更熟练的那个人的方法做完。", "一起把视频从头再看一遍，看到不一样时停下。"], ["三个人同时给你发消息，一个问约见地点，一个催你选照片，一个发来长语音。", "先回最早到的消息，再依次处理。", "先回最容易的一条，让自己能开始处理。", "先回马上要出门的人，再告诉另外两位你什么时候看。"], ["原定活动临时取消，朋友已经到了，还说“白跑一趟挺烦的”。附近有两个备选，一个要等半小时。", "说“确实扫兴”，然后自己决定去不用等的地方。", "接住对方的抱怨，报出两个备选的等待时间，问他想换个地方还是改天。", "先解释活动取消不是你的决定，再继续查其他地方。"]], "praise": [["两次排队就去看时段分布，抓得很准。", "把偶然和规律分开，下次出门就有了可用的依据。"], ["你盯住的是出门流程里被打断的那个动作。", "提醒放对一步，省过每天靠记性和意志力硬撑。"], ["角色和路线一起换过，你知道这局只该动一个变量。", "下一局的输赢终于能给你一点能用的信息。"], ["一句“还要几分钟”，直接补上了你做决定缺的数字。", "在门口等还是先进去，现在可以算清楚再选。"], ["第三步对不上，你直接追折痕和纸角。", "定位偏差之后，前两步的成果通常还能接着用。"], ["你给出了两个片名、一个截止点和一个默认选项。", "群聊里每个人都能低成本表态，电影也有机会准时开场。"], ["把十分钟拆成收拾、出门、到达，够具体。", "查到是哪段超时，改一个动作就可能解决反复迟到。"], ["这题处理得漂亮。两种拼法各跑五分钟，桌上的进度会给出答案。", "边框和颜色分组都有机会派上用场，两个人也能更快决定怎么分工。"], ["你先检查了视频的时间，再找近期记录。", "依据够新，出发时间才值得跟着变。"], ["三盆里只有一盆总变干，你先看那一盆的条件。", "调整范围越准，另外两盆越少被不必要地折腾。"], ["你把“不想去”讲成了“想找个能聊天的地方”。", "对方知道你真正要什么，换店就有了明确标准。"], ["一句“这张我不想发”，再给两张可用的，你把边界交代得很干净。", "朋友有下一步可走，也知道哪些照片需要你点头。"], ["你先和已经有约的人确认，再决定要不要接新的邀请。", "两件事都有协商空间，答应出去的承诺也经得住变动。"], ["你把“今晚还我”落到了九点前，还留了具体还东西的时间。", "自己的需求守住了，对方也有可安排的余地。"], ["看出了失误还能先问对方想不想听，时机抓得好。", "对方愿意听时，你指出的那一点更可能真正用到下一局。"], ["你把“那件事是私下说的”和“以后先问我”都说清楚了。", "对方知道哪一步越界，也知道下次怎么处理。"], ["朋友画的那一部分，你当场说出来了。", "贡献在哪里，夸奖就到哪里。一起做事的人也更容易相信彼此。"], ["下小雨，你立刻看到了顶棚这条路。", "原约还能兑现，走多远则可以按现场雨势调整。"], ["你把一包零食的分歧安排成两次轮换。", "两个人的偏好都有机会落实，这次也能很快选完。"], ["私聊要离开原来的对话，你把当事人的同意和隐私放进了决定里。", "想传的信息仍有办法说明，朋友也保留了对自己话语的决定权。"], ["一人只能上午、一人只能待两小时，你直接找到了重叠时段。", "安排发出来就能执行，少一轮来回报时间。"], ["菜洗了两次、米没煮，你先补空缺，再把剩下的事分清。", "这顿饭能往前走，重复做的活也会少一点。"], ["七点半有人要走，你把整局目标拆成了一个能在此前收尾的安排。", "先走的人能打完一局，留下的人也有清楚的加赛条件。"], ["标价、路费、取货时间和到手日都放进来，比较才完整。", "买到手要付的实际成本清楚了，便宜的选项到底值不值也更好判断。"], ["发现饮料重复，你直接找到了名单上缺的纸杯。", "换完同步一次，第二天大家按同一张清单走。"], ["先把半小时当硬限制，再把拍照点当选择条件。这个顺序很清楚。", "路线既走得完，也有机会满足另一位同行者的愿望。"], ["你记得对方上次只记住第一步，这次干脆把说明压到两步。", "对方先有动作可以做，你也能从他回的消息知道下一步该怎么讲。"], ["你让已交照片先进入第一版，也给晚交的人留了补交窗口。", "进度能启动，其他人还有明确的时间参与。"], ["规则讲两遍还卡住，你直接拿这一局演示。", "抽象的分歧变成桌面上能共同核对的一步。"], ["有人不能吃一种食材，你先核对眼前能吃的，再处理缺的那份。", "信息和行动对上了，临时找替代也更有方向。"], ["球场关了，你先看看空地够不够用，再换活动。", "带来的跳绳马上派上用场，原本空掉的时间也能用起来。"], ["胶带不行，你先用手边的夹子和绳子试一个角。", "一次小试就能看出承不承重，几乎不用重新准备材料。"], ["锁着的门已经给了开放入口的示意图，你直接用了现场信息。", "少绕一圈围栏，也少一次靠运气找门。"], ["纸剪短了，你先量缺口和余纸，再决定补还是改。", "两个方案的成本一比较，后面就少一次补了又撕。"], ["合照背光，挪几步试拍一张。这是个干脆的小验证。", "看到人脸够亮再拍正式照，几个人就不用一直站着等。"], ["架子一晃，先看它放在哪儿。这一步很省心。", "平地上稳了可以继续装，仍然晃就检查连接处，几十秒可能省下一次拆装。"], ["只剩 5% 电，你提前把路线和地址截下来，还让朋友知道可能联系不上。", "手机关机以后，行程也有机会继续按约推进。"], ["扫码不灵，你先按眼前这台柜子的说明查。", "找到漏掉的那一步，比从头重复一遍更容易解决问题。"], ["先拿一小碗试水量，聪明在改动的范围很小。", "小样调对了再动整锅，原来的汤还留得住。"], ["热座位旁边就有阴凉长椅，你先看是否适合坐，再提议换。", "眼前的变化直接变成一个能落地的选择。"], ["你问大家真正想保留桌游的哪一部分。", "十五分钟也能保住大家最在意的体验。"], ["听见“今天发生了点事”，你把谈不谈和什么时候谈留给朋友。", "一句话就给了对方开口的入口，也给你们留了继续原行程的选择。"], ["你记住的是上次弄湿的具体两样东西。", "防水袋用在最需要的地方，准备更准，也不用把包塞满。"], ["只交换先后顺序，其他规则照旧。这一步把结论做得可检查。", "下一局有变化时，你就更容易判断是不是先手造成的。"], ["你给了继续看、换短片和聊天三种形式。", "看手机的人可以直接表达偏好，剩下的时间也不会被一部片子锁住。"], ["听到“每次”，你先把它问成了“刚才选路线那次吗”。", "具体到某一步以后，对方可以讲清不舒服在哪里，你也有地方说明自己的记忆。"], ["先查旧口袋，再把钥匙固定放在同一个包。", "这次找得到，下次换外套也少一次同样的麻烦。"], ["你让两个人先指给对方看，自己说的“正面”到底是哪一面。", "找准定义上的分岔，后面就能从同一步重新接上。"], ["你把最先要出门的人提到了最前面。", "紧迫的事先落地，另外两个人也知道什么时候能等到回复。"], ["活动取消后，你把等待时间报清楚，还给朋友选择的机会。", "失望有人听见，剩下的时间也能尽快做个双方都接受的决定。"]]}</script>
<script>
const d=JSON.parse(document.querySelector('#dataset').textContent);
const app=document.querySelector('#app');
const key='scenario-'+d.kind+'-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}
const answers=Array.from({length:50},(_,i)=>Number.isInteger(saved.answers?.[i])&&saved.answers[i]>=0&&saved.answers[i]<3?saved.answers[i]:null);
let index=0;
let complete=Boolean(saved.complete)&&answers.every(a=>a!==null);
const done=()=>answers.filter(a=>a!==null).length;
const score=(i,a=answers[i])=>a===null?0:Number(d.keys[i][a]);
const tone=i=>'--color:var(--c'+i+')';
function save(){try{localStorage.setItem(key,JSON.stringify({answers,complete}))}catch{}}
function show(html,focus=false){app.innerHTML=html;window.scrollTo(0,0);if(focus)app.querySelector('h1')?.focus({preventScroll:true})}
function graph(values,total){
  if(d.kind==='intj')return '<div class="columns" aria-hidden="true">'+values.map((v,i)=>'<div class="column" style="'+tone(i)+'"><div class="column-track"><span class="column-fill" style="height:'+(v*5)+'%"></span></div><small>'+d.codes[i]+'</small></div>').join('')+'</div>';
  return '<svg class="rings" viewBox="0 0 230 230" aria-hidden="true">'+values.map((v,i)=>{const r=101-i*14,c=2*Math.PI*r;return '<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="9"/>'+(v?'<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--c'+i+')" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(v*c/20)+' '+c+'" transform="rotate(-90 115 115)"/>':'')}).join('')+'<text x="115" y="121" text-anchor="middle" font-size="22" font-weight="800">'+(total??'5 项')+'</text></svg>';
}
function startButton(){return '<button class="primary" data-action="start">'+(complete?'查看上次结果':done()?'继续测试':'开始测试')+' →</button>'}
function home(){
  show('<section class="hero"><div><div class="kicker">认识你的日常应对方式</div><h1 tabindex="-1">'+d.headline+'</h1><p>'+d.about+'</p>'+startButton()+'</div><div class="hero-art"><p class="artlabel">五项结果 · 图表示意</p>'+graph([17,13,15,10,12])+'</div></section><div class="stats"><div><strong>50</strong><span class="quiet">道情景题</span></div><div><strong>5–7</strong><span class="quiet">分钟预计用时</span></div><div><strong>5</strong><span class="quiet">观察维度</span></div></div><section class="card"><h2>五个观察维度</h2><div class="grid">'+d.labels.map((x,i)=>'<div class="tile" style="'+tone(i)+'"><i class="dot"></i><h3>'+x+'</h3><p>'+d.notes[i][0]+'</p></div>').join('')+'</div></section><section class="card"><h2>做完能看到什么？</h2><p>'+d.benefit+'</p><div class="grid"><div class="tile"><h3>总档位与单项分数</h3><p>低阶、中阶或高阶，以及五项各自的分数与表现。</p></div><div class="tile"><h3>优势与场景练习</h3><p>依据实际选择，看到做得好的部分、带来的好处，以及类似场景的其他做法。</p></div></div></section><section class="card center"><h2>按最近三个月的实际表现作答</h2><p class="quiet">选你通常最先会做的事。答案保存在当前浏览器，可随时回来继续。</p>'+startButton()+'</section>');
}
function quiz(focus=true){
  const q=d.questions[index];
  show('<div class="reader"><div class="row"><button class="secondary" data-action="home">← 首页</button><span class="quiet">已答 '+done()+'／50</span></div><div class="progress" role="progressbar" aria-label="已答题数" aria-valuemin="0" aria-valuemax="50" aria-valuenow="'+done()+'"><span style="width:'+done()*2+'%"></span></div><section class="card"><div class="kicker">第 '+(index+1)+'／50 题</div><h1 class="qhead" tabindex="-1">'+q[0]+'</h1>'+q.slice(1).map((x,j)=>'<button class="choice" data-option="'+j+'" aria-pressed="'+(answers[index]===j)+'"><span class="letter">'+('ABC'[j])+'</span><span>'+x+'</span></button>').join('')+'<div class="actions"><button class="secondary" data-action="back" '+(!index?'disabled':'')+'>上一题</button><button class="primary" data-action="next" '+(answers[index]===null?'disabled':'')+'>'+(index===49?'查看结果':'下一题 →')+'</button></div></section></div>',focus);
}
function summarize(){
  const scores=d.labels.map((_,g)=>answers.slice(g*10,g*10+10).reduce((sum,a,j)=>sum+score(g*10+j,a),0));
  const total=scores.reduce((a,b)=>a+b,0);
  const gate=d.kind==='intj'&&scores.some(n=>n<10);
  const stage=total<50?'低阶':total<75||gate?'中阶':'高阶';
  return {scores,total,stage,limited:total>=75&&gate};
}
const rank=n=>n<10?'低':n<15?'中':'高';
const gentle=d.kind==='infj';
const paragraphList=lines=>lines.map(line=>'<p>'+line+'</p>').join('');
function letter(total,good){
  const first=gentle
    ? '谢谢你花时间做完这 50 题。朋友只回了一个字、家人替你答应了一件事、临出门又收到一条让人心里一紧的消息。这些小事平时很快就过去了。你愿意回头看看自己当时会怎么想、怎么做，这份认真值得被看见。'
    : '50 题做完了，干得好。你已经把一批平时来不及复盘的小事放到一起看了：信息少的时候怎么判断，计划卡住的时候从哪里下手，对方有不同意见时又怎么谈。现在你手上有具体的例子，可以拿来决定下一步。';
  const example=good.length&&score(good[0])===2&&answers[good[0]]===d.keys[good[0]].indexOf('2')?(gentle?'读到第 '+(good[0]+1)+' 题时，可以为自己高兴一下。'+d.praise[good[0]][1]:'第 '+(good[0]+1)+' 题值得回看。'+d.praise[good[0]][1]):gentle
    ? '有些时刻，你可能会先把眼前的事情过完，等有了余力才知道自己想说什么。那段缓冲也有它的用处。愿意回来想清楚、补上一句话，已经是在照顾自己，也在给关系一个继续谈的机会。'
    : '这次有些选择偏向先把眼前的事处理掉。这个习惯有它的用途。想练得更灵活，就挑一个你最常卡住的场景，加一步检查，看看结果会不会变。';
  const close=gentle
    ? (total>=75?'已经顺手的那些小动作，值得你继续信任。哪天累了，或者话到嘴边又停住了，也可以给自己一点时间。晚些再开口，依然能把重要的话说出来。':'如果某个分数让你有点沮丧，可以先把注意力放回那道题：当时你在顾虑什么？下次只多做一点点会是什么？一句“我晚点再回你”也算进展。能把这句话说出来的那次，就值得记住。')
    : (total>=75?'你已经有几套能用的办法。下一步挑最容易失灵的那类场景，给它配一个备用动作。试一次，看看有没有少来回一轮、少返工一次，或者更快听清对方到底在说什么。':'先挑一个反复出现的卡点。下次遇到它，只改一个动作。比如先问清一个条件，再给方案。试完看结果：有没有更快推进？对方有没有少解释一遍？能回答这两个问题，这次调整就有收获。');
  return '<section class="card letter-note"><h2>'+(gentle?'给认真做完这 50 题的你':'做完 50 题，给你的几句话')+'</h2>'+paragraphList([first,example,close])+'</section>';
}
const specificAdvice={
  infj:{
    0:['一条短回复能承载的意思很有限。如果你已经开始想见面时要怎么弥补，可以先让自己停在已知的那部分。','想确认安排时，问“周日下午三点你方便吗？”这句话很容易回。','如果时间已经定了，也可以照常去见面。等对方提起，再聊他有没有介意改约。'],
    10:['半夜有人来找你，想陪陪他很自然。明天要早起也是一件值得照顾的事。','有余力约时间时，可以说“我今晚要睡了，明天午休能听你说二十分钟”。','明天也排满了，就说“我今天聊不了，这两天也没整块时间”。把自己能给的范围说清楚就可以。'],
    12:['被拿来开玩笑时，有人会下意识跟着笑。过了一阵才觉得不舒服，也可以再开口。','如果当时说得出口，可以短短一句：“刚才那句我听着不舒服，换个话题吧。”','更愿意私下说的话，散场后发一句：“刚才你两次提我迟到，我不太喜欢被这样开玩笑，下次别提了好吗？”'],
    41:['穿鞋出门时突然看到这句话，想立刻解释很可以理解。你手上还有一件马上要做的事。','如果担心对方以为你没看见，可以先说：“我看到了，我现在要出门，今晚七点聊好吗？”','时间还说不准，就回：“我看到了，到地方后回你。”等安顿下来，先听听对方说的是哪件事。']
  },
  intj:{
    7:['拼边框和按颜色分都能起步。先给两种做法五分钟，桌上的进度会提供比争论更直接的信息。','拼图块多就分工：一个找边缘，一个做颜色组，五分钟后看能不能接起来。','桌面太小的话，先共同清出一块空位，再决定哪组图案最适合先做。'],
    35:['架子在斜桌上晃，先把桌面这个变量排掉。挪到平地轻推一下，再决定动哪颗螺丝。','如果只在斜桌上晃，先换放置面。已经装好的部分可以直接保留。','在平地还晃，就从第一个能看到松动的连接处查起，避免整架重装。'],
    45:['听到“每次”，先把范围收回来。你记得的反例可以留到后面，眼下先定位对方在说哪一次。','有怀疑的场景就直接问：“是刚才选路线那次吗？哪一步你觉得我替你定了？”','完全没想到就请他举一例。听完再说你记得的经过，接下来明确哪一步该由谁决定。'],
    49:['朋友已经到了，先把可用选项和等待时间摆出来。解释取消原因可以晚一点。','如果对方还想继续，直接问：“近的不用等，另一个要半小时，去哪个？”','如果他已经没兴致了，给出改天这个选项。今天的变动到这里就能收尾。']
  }
};
function feedback(i,g,positive){
  const [q,...options]=d.questions[i];
  const [,practice,alternative]=d.notes[g];
  const chosen=options[answers[i]];
  const top=options.find((_,a)=>score(i,a)===2&&a!==answers[i]);
  const smallerStep=options.find((_,a)=>score(i,a)===1&&a!==answers[i]);
  let lines;
  if(positive){
    const firstTop=d.keys[i].indexOf('2');
    const tied=score(i)===2&&answers[i]!==firstTop;
    const observed=score(i)===2&&!tied;
    const ending=gentle
      ? ['这一步值得记下来。以后又遇到类似的事，你知道自己已经有一种可以用的办法。','这个小动作很值得保留。哪天没有余力做更多，能做到这里也已经有帮助。','可以把这次的做法留给以后的自己。再遇到类似的情况，你已经知道从哪里开始。']
      : ['这一步可以复用。条件差不多时，直接从这里起手。','把这个动作留下来，下次卡在相似的地方就用它开局。','下次遇到同类问题，照这个顺序走一遍，再看结果。'];
    const opening=tied
      ? (gentle?'你选了等散场后私下说清楚。这给了自己和对方一个更从容的开口时机。':'你提出重写内容、移除可识别的细节。这一步把分享的目的和当事人的隐私都考虑进去了。')
      : (score(i)===0&&gentle?'改约后收到一个“行”，你先想到见面时照顾朋友的感受。这份体贴可以留下，确认他介不介意之后再决定怎么表达。':score(i)===0?'先进去、到了再联系，至少让自己手上的时间能继续用。把碰头地点说清楚，这个安排就更稳。':gentle?'你给这件事找到了一个可以开始的动作。能先做一点，已经给接下来的处理留了空间。':'这个选择先定了一个起点。手里有个明确动作，接下来就有地方可以调整。');
    lines=[observed?d.praise[i][0]:opening,observed||tied?d.praise[i][1]:score(i)===0?(gentle?'多问一句时间是否方便，你也可以少背一点猜测带来的负担。':'发一句“我在里面入口等”，对方到了就知道怎么找你。'):d.notes[g][0],ending[g%ending.length]];
  }else{
    const lead=gentle
      ? ['给自己一点时间是可以的。如果这件事还需要处理，可以把下一步缩成一个小动作。','这个场景很容易一下子顾不过来。下次可以只试一个变化，看看会不会更轻松。','如果原来的做法让你事后还惦记着，可以试试把需要说的那一步提前一点。']
      : ['先动一个环节。动作足够小，你才能看出改变带来的效果。','这个场景有一个可以立即换掉的步骤。挑一次试试，再看有没有少一次来回。','下一轮只改第一步。给它一次机会，看看事情能不能更快走下去。'];
    lines=specificAdvice[d.kind][i]??[lead[g%lead.length],top?'同场景可以试：'+top:practice,smallerStep?(gentle?'想先试轻一点的做法，也可以这样开始。':'想把改动再缩小，就从这一步开始。')+smallerStep:alternative];
  }
  return '<div class="tile feedback"><h3>'+d.labels[g]+' · 第 '+(i+1)+' 题</h3><p class="quiet">'+q+'</p><blockquote>你的选择 · '+chosen+'</blockquote>'+paragraphList(lines)+'</div>';
}
function result(){
  const {scores,total,stage,limited}=summarize();
  const groups=scores.map((_,i)=>i);
  const high=groups.slice().sort((a,b)=>scores[b]-scores[a]);
  const low=groups.slice().sort((a,b)=>scores[a]-scores[b]);
  const indices=g=>Array.from({length:10},(_,i)=>g*10+i);
  const good=high.map(g=>indices(g).find(i=>score(i)===2)).filter(i=>i!==undefined).slice(0,3);
  if(good.length===0){const partial=high.flatMap(indices).find(i=>score(i)===1);if(partial!==undefined)good.push(partial);else good.push(d.kind==='infj'?0:3);}
  const grow=low.map(g=>indices(g).find(i=>score(i)===0)??indices(g).find(i=>score(i)===1)).filter(i=>i!==undefined).slice(0,2);
  const sub=d.kind==='intj'?'<section class="card"><h2>四种补充练习</h2><p class="quiet">每种用两题回顾具体做法。</p><div class="grid">'+[
    ['扩展备选（Ne 视角）',[40,44],'给原目标和活动形式各想一个备选。'],
    ['确认对方需要（Fe 视角）',[41,45],'解释前先问对方现在想谈什么。'],
    ['调用具体经验（Si 视角）',[42,46],'把上次漏掉的细节变成这次的提醒。'],
    ['检查逻辑与定义（Ti 视角）',[43,47],'一次只改一个条件，或先核对双方对同一个词的理解。']
  ].map(([label,ids,tip])=>'<div class="tile"><h3>'+label+' · '+ids.reduce((a,i)=>a+score(i),0)+'／4</h3><p>'+tip+'</p><p class="quiet">回顾第 '+ids.map(i=>i+1).join('、')+' 题</p></div>').join('')+'</div></section>':'';
  show('<section class="card overview"><div><h1 class="qhead" tabindex="-1">你的情景应对结果</h1><div class="total">'+total+' <small>／100</small></div><div class="pill">'+stage+'</div><p class="quiet">'+(limited?'总分已达高阶区间。待拓展维度：'+d.labels.filter((_,i)=>scores[i]<10).join('、')+'。':stage==='高阶'?'你在多类场景中展现了不同的应对做法。':stage==='中阶'?'你在一些场景会调整做法，有些场景更习惯用第一反应。':'先从一种容易尝试的新做法开始。')+'</p></div>'+graph(scores,total)+'</section><section class="card"><h2>五项分数</h2><p class="quiet">每项独立按 20 分计算。图形长度表示该项得分比例。</p>'+d.labels.map((x,i)=>'<div class="metric" style="'+tone(i)+'"><div class="row"><span><i class="dot"></i>'+x+'</span><strong>'+scores[i]+'／20 · '+rank(scores[i])+'</strong></div><div class="meter" aria-hidden="true"><i style="width:'+scores[i]*5+'%"></i></div></div>').join('')+'</section>'+letter(total,good)+'<section class="card"><h2>你已经做得好的地方</h2>'+(good.length?good.map(i=>feedback(i,Math.floor(i/10),true)).join(''):'<p>这次可以先从你得分最高的“'+d.labels[high[0]]+'”开始回顾。想一件类似的小事，看看原来的做法解决了什么。</p>')+'</section><section class="card"><h2>下一次还可以怎么做</h2>'+(grow.length?grow.map(i=>feedback(i,Math.floor(i/10),false)).join(''):'<p>你这次每题都选择了本问卷评分最高的做法。可以回想最近一次遇到类似情况时，你是在什么条件下做到的。</p>')+'</section>'+sub+'<div class="row end"><button class="secondary" data-action="home">返回首页</button><button class="secondary" data-action="restart">重新测试</button></div>',true);
}
app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const option=button.dataset.option;
  if(option!==undefined){
    answers[index]=Number(option);complete=false;save();
    app.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    const progress=app.querySelector('.progress');
    progress.setAttribute('aria-valuenow',done());progress.firstElementChild.style.width=done()*2+'%';
    app.querySelector('.reader > .row .quiet').textContent='已答 '+done()+'／50';
    app.querySelector('[data-action=next]').disabled=false;return;
  }
  switch(button.dataset.action){
    case 'home':home();break;
    case 'start':if(complete){result();break}index=done()===50?49:answers.indexOf(null);quiz();break;
    case 'back':if(index>0){index--;quiz()}break;
    case 'next':
      if(answers[index]===null)break;
      if(index<49){index++;quiz();break}
      if(done()<50){index=answers.indexOf(null);quiz();break}
      complete=true;save();result();break;
    case 'restart':
      if(!confirm('清除本次答案，重新开始？'))break;
      answers.fill(null);complete=false;index=0;save();quiz();break;
  }
});
home();
</script>
</body></html>
