splay:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:16px;background:var(--panel);border-radius:17px;border:1px solid var(--line)}.tile p{margin:0;color:var(--muted);font-size:.9rem}.tile .dot{display:block;margin-bottom:7px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--color);flex:none}.foot{padding:10px 0 28px}.reader{max-width:710px;margin:24px auto 0}.progress{height:9px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 20px}.progress span{height:100%;display:block;background:var(--accent);border-radius:99px}.qhead{font-size:clamp(1.35rem,4vw,2rem);margin-bottom:21px}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:14px;border-radius:17px;margin:10px 0;min-height:64px}.choice[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.letter{flex:0 0 33px;height:33px;display:grid;place-items:center;border-radius:50%;background:var(--card);font-weight:800}.actions,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{margin-top:22px}.row{flex-wrap:wrap}.rings{max-width:260px;width:100%;margin:auto;display:block}.rings text{font-family:inherit;fill:var(--ink)}.columns{height:172px;display:flex;justify-content:center;align-items:stretch;gap:clamp(8px,3vw,25px);padding:4px 12px 0}.column{display:grid;grid-template-rows:1fr 25px;gap:6px;flex:1;max-width:55px;text-align:center}.column-track{height:100%;border-radius:16px;background:var(--track);display:flex;align-items:end;overflow:hidden}.column-fill{width:100%;border-radius:16px;background:var(--color)}.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:25px;align-items:center}.total{font-size:clamp(3rem,9vw,5rem);font-weight:850;line-height:1.05;letter-spacing:-.07em}.total small{font-size:1.25rem;letter-spacing:0;color:var(--muted)}.pill{disp <body class="intj"><div class="wrap"><header class="top"><span class="brand">INTJ</span><span class="quiet">情景应对自测</span></header><main id="app"></main><footer class="foot quiet">借鉴 <a href="https://www.myersbriggs.org/unique-features-of-myers-briggs/type-dynamics-overview/" target="_blank" rel="noopener">MBTI 类型动力学</a>。分档为本问卷试测规则，用于回顾这次作答中的行为选择。</footer></div>
<script id="dataset" type="application/json">{"headline": "把计划做实，\n也留出别的路。", "about": "借用 MBTI 类型动力学中的 INTJ 视角，用朋友相处、一起做事和计划临时变化等日常情景，观察你如何判断、执行、表达价值和现场调整。", "benefit": "看见你擅长的决策与执行方式，并发现什么时候可以多问一句、多想一个备选，或把眼前的新信息用起来。", "labels": ["判断与验证", "价值与边界", "组织与执行", "现场观察与应变", "切换视角与综合调整"], "codes": ["Ni", "Fi", "Te", "Se", "综合"], "keys": ["210", "102", "021", "120", "210", "012", "120", "210", "012", "210", "021", "210", "012", "201", "012", "120", "201", "210", "120", "022", "120", "210", "012", "021", "201", "012", "120", "210", "021", "210", "021", "210", "102", "210", "021", "102", "210", "210", "021", "210", "120", "201", "102", "021", "201", "012", "021", "201", "012", "120"], "notes": [["检查最初的假设，可以省下按错误方向做事的时间。", "先写下你最有把握的解释，再找一条可能推翻它的信息。", "用一个小对照试验，每次只改一个条件。"], ["说清自己在意的事，能帮助对方理解你的选择，也让约定更好落实。", "先用一句话说清自己的偏好，再给一个可接受的备选。", "如果对方说自己表现差，先问对方想听建议还是先继续。"], ["把限制和下一步说清楚，可以减少等待和重复分工。", "约不下来时，给两个可选时间，再写下默认安排。", "多人一起做事时，列出剩下的任务，让大家认领。"], ["先看眼前的条件再调整，可以节省试错和返工。", "先找现场的提示、样品或可用工具，再决定要不要重来。", "用一个可撤回的小动作试备用方案，再扩大改动。"], ["根据对方的需要和现场线索切换做法，会让原本卡住的事情有更多出路。", "先问“你想先聊聊，还是一起找个替代方案？”", "同时想一个保持原目标的备选，和一个改变活动形式的备选。"]], "kind": "intj", "name": "INTJ", "questions": [["你和朋友连续两次下午去一家店，两次都排了半小时。下周还想去。", "查一下周末和工作日的排队时段，再选出发时间。", "提前半小时到，给排队留时间。", "认定这家一直要排半小时，以后都按这个时间算。"], ["你发现最近三次都忘了带水杯，其中两次是临时改了出门时间。", "在原来的出门时间设一个提醒。", "觉得自己最近记性差，下次出门时努力想一遍。", "看看三次忘带前有没有同一个动作被打断，再决定在哪一步提醒。"], ["一起玩的游戏总在同一关输。上一局你们换了角色，也换了路线。", "认定新角色不好用，下局直接换回去。", "下局只换回路线，看看失败的位置有没有变化。", "把角色和路线都换回以前的组合，先打一局看看。"], ["你和朋友约三点在门口见。三点十分，他还没到，只发了一句“快了”。", "回“好”，再等十分钟看看。", "问还要几分钟，好决定是在门口等，还是先进去。", "回“你到了叫我”，先进去逛。"], ["你照着短视频折纸，折到第三步，手上的纸和画面里的方向对不上。", "暂停画面，对照折痕和纸角，找是哪一步转错了方向。", "从头再折一张，这次把视频调慢。", "按自己猜的方向先折下一步，看能不能接上。"], ["四个人选电影。三个人都说“随便”，你发了两个片名，五分钟没人选。", "定自己想看的那部，把片名发到群里。", "再发一部，看看有没有人对新选项感兴趣。", "发一句“喜剧和动画二选一，八点前没回我就先选喜剧”。"], ["你连续三次出门都比预计晚十分钟。下次还是走同一条路。", "把出门提醒提前十分钟。", "分别记下开始收拾、出门和到达的时间，看时间花在哪。", "维持原来的出门时间，路上走快一点。"], ["两个人一起拼图。你想先拼边框，对方已经开始按颜色分。", "各用自己的方法先拼五分钟，看看能不能分工。", "先跟着对方按颜色分，拼不动时再换。", "请对方先放下手里的颜色组，跟你一起拼边框。"], ["你看了两个说“早去人少”的视频，后来发现它们都是去年拍的。", "还是按视频里的时间出发。", "把出发时间再提前一点，给排队留余量。", "看看最近一周有没有同一时段的到访记录，再决定几点出门。"], ["你给三盆植物按同样的频率浇水，只有窗边那盆总在两天后变干。", "比较三盆的光照和土的干湿，再决定只调整哪一盆。", "下次给窗边那盆多浇一点，看看能撑几天。", "把三盆都改成隔天浇水。"], ["两位朋友选了很吵的店，你更想找个能听清彼此说话的地方。三人还没出发。", "先答应去那家，到了觉得太吵再提。", "说“我今天更想找个能聊天的地方”，提议去附近另一家。", "问“能不能换一家？”等对方问起再说原因。"], ["朋友想把你拍得不自在的一张合照发到群里，另外还有两张合照。", "说“这张我不想发，另外两张都可以”。", "说“换一张吧”，看看朋友选哪张。", "说“你决定吧”，发出后再考虑要不要请他删。"], ["你答应陪朋友散步，家人临时邀你在同一时间看一场你很想看的演出。", "先答应去看演出，再告诉朋友散步取消。", "按原约定去散步，直接谢绝演出。", "先问朋友改到另一时段是否方便，等他答复再决定要不要去看演出。"], ["你把东西借给家人，说好今晚拿回来。对方想再用一天，但你明早就要用。", "说“我明早要用，今晚九点前得拿回来”，问对方几点方便还。", "先同意多借一天，明早再想办法。", "告诉对方你明早要用，问他今晚能不能还。"], ["朋友玩游戏连输两局，说“我玩得真烂”。你看出他总在同一处失误。", "马上告诉他失误在哪，下一局应该怎么改。", "说“这关确实容易卡”，照常准备下一局。", "说“我看到一处可能能帮你。你想听一下，还是先玩下一局？”"], ["朋友把你私下讲给他的糗事说给了别人。散场后你们可以单独说话。", "说“刚才那个笑话让我不太舒服”，看看他怎么回应。", "说“那件事我是私下告诉你的。以后要讲给别人，先问我一下。”", "先略过这件事，以后少跟他讲自己的事。"], ["别人夸你独自做完了一张海报，其实朋友也画了其中一部分。", "当场指出朋友做了哪一部分，再谢谢对方。", "先收下夸奖，过后私下感谢朋友。", "当场说“其实有朋友一起做”，继续原来的话题。"], ["你和朋友约好散步，出门时开始下小雨，附近有一段带顶棚的路。", "提议走有顶棚的那段，见面后看雨势再决定走多远。", "发消息问还走不走，等朋友决定。", "先照原路线走，到了再看哪里能避雨。"], ["两个人合买一包零食，你想试新口味，对方想买平时那种。", "选平时那种，这次先省下讨论时间。", "提议这次选对方的口味，下次轮到你时试新的。", "坚持买新的，觉得吃过的口味下次也能买。"], ["大家想把一张截图转发到别的群，截图里有朋友的私聊内容。", "先转发，朋友介意时再撤回。", "先问朋友愿不愿意让这段私聊被转发。", "建议把想分享的信息重新写一遍，删去私聊原话和能认出当事人的细节。"], ["三个人约周末出门，一人只能上午，一人最多待两小时。", "先约最早能碰面的时间，活动当天再定。", "找一段都能参加的时间，发一个两小时内能走完的安排。", "先发自己想去的三个地点，让大家各自报能待多久。"], ["四个人一起做一顿简单的饭，菜洗了两遍，米还没人煮。", "自己把米煮上，再说清剩下两件事各由谁做。", "自己先把米煮上，其他人做什么等会儿再看。", "提醒大家“别重复做”，继续做手上的事。"], ["你们借来的游戏晚上八点要还，离结束还有三局，七点半还有人要先走。", "按原来的局数继续，快到八点再看能不能打完。", "每局都玩快一点，争取按时结束。", "先约定七点半前打完一局，再看剩下的人要不要加赛。"], ["两个人想买一件共用物品，一件便宜但只能自取，一件贵些能送到家。", "选便宜的，下单后再想怎么取。", "把来回路费、取货时间和到手日期放在一起比。", "先问对方哪天能取，再比较两件的标价。"], ["群里说好每个人带一样东西，第二天就要见面，名单上有两个人写了同一种饮料。", "问其中一人能不能换成还没人带的纸杯，然后发更新后的名单。", "在群里说饮料重复了，请大家自己看着调整。", "自己到时候多带点纸杯，名单先照旧。"], ["你们要从三条散步路线里选一条，一人只能走半小时，一人想拍照。", "先选照片最好看的路线，到时间再折返。", "选最短的路线，到了再看有没有能拍的地方。", "先筛掉半小时走不完的路线，再在剩下的里选有拍照点的。"], ["你要把一段做法发给朋友。他第一次做，上次看到长消息只记住了第一步。", "发完整说明，把第一步加粗。", "先发现在要做的两步和一张示意图，请他做完回个消息。", "把上次的原文再发一遍，请他这次仔细读。"], ["大家约好今晚各选五张照片做相册，已经十点，只有两个人交了。", "先告诉大家第一版会用已交的照片，明天中午前还能补，再开始做。", "先用已交的照片做两页，明天再问剩下的人。", "等大家全部交齐，再开始做。"], ["同一套游戏规则你讲了两遍，大家还是在同一个地方停下来争论。", "把规则再从头讲一遍。", "找出那条有争议的规则，拿眼前这一局走一遍给大家看。", "先由你决定这一局怎么算，结束后再解释。"], ["你们约好各带一道吃的，有人当天才说他不能吃其中一种食材。", "先确认哪些现成食物符合他的限制，再商量缺的那一份怎么补。", "请他先吃自己确定能吃的东西，到了再看看。", "按原安排带食物，到场后请他自己挑。"], ["到了球场才发现正在维修，旁边有块空地，也带了跳绳。", "在原地等一会儿，看球场会不会开放。", "改去空地跳绳，先看地面和空间是否合适。", "先找下一个球场，走过去看看开没开。"], ["你准备把一张纸贴在墙上，胶带一贴就翘，桌上还有夹子和绳子。", "用夹子和绳子先试挂一个角，看能不能固定。", "换一段更长的胶带，贴两层再试。", "继续用原来的胶带，把翘起的地方多按几次。"], ["沿着地图走到公园侧门，发现门锁着，门上贴了开放入口的示意图。", "沿围栏先走一段，看看有没有别的小门。", "在原地等，看看有没有人从里面开门。", "看示意图确认最近的开放入口，再调整路线。"], ["手工做到一半，纸已经剪短了一截，手边还剩一小段同色纸。", "先比一下缺口和余纸的大小，再决定拼接还是改尺寸。", "先把同色纸贴上，再看接缝能不能藏住。", "继续按原尺寸做，最后再处理缺掉的一截。"], ["你们本来要拍一张合照，原位置背光，旁边几步就是阴凉处。", "继续站原处，让拍照的人多拍几张。", "先在阴凉处试拍一张，确认人脸清楚再拍正式照。", "留在原地，请拍照的人先调一下亮度。"], ["你装了一半的小架子开始晃，桌面也有点斜。", "先把已经装上的螺丝都拧紧。", "继续装完，最后再看还晃不晃。", "先移到平地轻推一下，分清是桌面斜还是架子松。"], ["出门前发现手机只剩 5% 电，到约见地点还要换乘一次。", "先截好路线和约见地址，告诉朋友可能没电。", "调成省电模式，换乘时再打开地图。", "一路开着地图，快关机时再看怎么办。"], ["你第一次用一个公共储物柜，扫码后打不开，柜门旁贴着本柜的操作步骤。", "按贴纸核对自己漏了哪一步，再试一次。", "先退出页面，重新扫码。", "连续点几次刚才那个按钮。"], ["你煮的汤尝起来太咸，离开饭还有十分钟。", "按原菜谱继续煮完，上桌后配清淡的食物。", "先舀一小碗试加一点水，味道合适再调整整锅。", "先往整锅里加一些水，再尝味道。"], ["你和朋友打算在户外坐一会儿，原来的座位晒得发烫，旁边有人刚离开一张阴凉长椅。", "先摸一下阴凉长椅是否干净、温度合适，再提议挪过去。", "先站一会儿，看看原座位有没有凉一点。", "把随身物品垫在原座位上，按原计划坐下。"], ["桌游只剩十五分钟，规则写着至少玩半小时。大家都想再玩一轮。", "只缩短每个人的思考时间，其他规则照旧。", "问大家更想保留对抗还是保留完整流程，按答案改成短局。", "按原规则开局，到点直接停。"], ["你问朋友为什么迟到，他沉默了一会儿，说“今天发生了点事”。", "问“你想先说说，还是我们先进去，晚点再聊？”", "接着问“所以到底为什么迟到？”", "先和他进去，等他自己再开口。"], ["上次出门野餐下过小雨，有两样东西弄湿了。这次天气看起来差不多。", "这次多带一件外套。", "按平时的晴天清单收拾，到了再找地方避雨。", "回想上次具体哪两样弄湿了，这次单独装进防水袋。"], ["游戏里有人说“先走的人总能赢”，你们只玩了两局，而且都是同一人先走。", "下局还是让他先走，看看他会不会三连胜。", "让两人交换先后顺序，其他规则照旧。", "让另一人先走，同时换个地图试试。"], ["你挑的电影播了二十分钟，有两个人开始频繁看手机。", "问大家想继续看、换短片，还是关掉聊一会儿。", "继续播放，等有人开口再说。", "先暂停，问大家要不要直接换一部电影。"], ["朋友说“你每次都替我决定”，你记得上次明明问过他。", "立刻举上次的例子，说明他记错了。", "先让他把话说完，再说你记得上次问过。", "先问“你指刚才选路线那次吗？”听清后再说自己的记忆。"], ["你连续两次把钥匙留在另一件外套里，今天出门前又换了外套。", "默念“别忘钥匙”，继续收拾。", "先检查旧口袋，再把钥匙放进每天都带的同一个包。", "先摸一下今天穿的外套口袋，发现没有再去找。"], ["两个人按同一份说明折纸，一个人折成正面，一个人折成反面。两个人都觉得自己照做了。", "各自指给对方看自己把哪一面当作“正面”，再对照第一张图。", "先按更熟练的那个人的方法做完。", "一起把视频从头再看一遍，看到不一样时停下。"], ["三个人同时给你发消息，一个问约见地点，一个催你选照片，一个发来长语音。", "先回最早到的消息，再依次处理。", "先回最容易的一条，让自己能开始处理。", "先回马上要出门的人，再告诉另外两位你什么时候看。"], ["原定活动临时取消，朋友已经到了，还说“白跑一趟挺烦的”。附近有两个备选，一个要等半小时。", "说“确实扫兴”，然后自己决定去不用等的地方。", "接住对方的抱怨，报出两个备选的等待时间，问他想换个地方还是改天。", "先解释活动取消不是你的决定，再继续查其他地方。"]]}</script>
<script>
const d=JSON.parse(document.querySelector('#dataset').textContent);
const app=document.querySelector('#app');
const key='scenario-'+d.kind+'-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}
const answers=Array.from({length:50},(_,i)=>Number.isInteger(saved.answers?.[i])&&saved.answers[i]>=0&&saved.answers[i]<3?saved.answers[i]:null);
let index=0;
let complete=Boolean(saved.complete)&&answers.every(a=>a!==null);
const done=()=>answers.filter(a=>a!==null).length;
const score=(i,a=answers[i])=>a===null?0:Number(d.keys[i][a]);
const tone=i=>'--color:var(--c'+i+')';
function save(){try{localStorage.setItem(key,JSON.stringify({answers,complete}))}catch{}}
function show(html,focus=false){app.innerHTML=html;window.scrollTo(0,0);if(focus)app.querySelector('h1')?.focus({preventScroll:true})}
function graph(values,total){
  if(d.kind==='intj')return '<div class="columns" aria-hidden="true">'+values.map((v,i)=>'<div class="column" style="'+tone(i)+'"><div class="column-track"><span class="column-fill" style="height:'+(v*5)+'%"></span></div><small>'+d.codes[i]+'</small></div>').join('')+'</div>';
  return '<svg class="rings" viewBox="0 0 230 230" aria-hidden="true">'+values.map((v,i)=>{const r=101-i*14,c=2*Math.PI*r;return '<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="9"/>'+(v?'<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--c'+i+')" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(v*c/20)+' '+c+'" transform="rotate(-90 115 115)"/>':'')}).join('')+'<text x="115" y="121" text-anchor="middle" font-size="22" font-weight="800">'+(total??'5 项')+'</text></svg>';
}
function startButton(){return '<button class="primary" data-action="start">'+(complete?'查看上次结果':done()?'继续测试':'开始测试')+' →</button>'}
function home(){
  show('<section class="hero"><div><div class="kicker">认识你的日常应对方式</div><h1 tabindex="-1">'+d.headline+'</h1><p>'+d.about+'</p>'+startButton()+'</div><div class="hero-art"><p class="artlabel">五项结果 · 图表示意</p>'+graph([17,13,15,10,12])+'</div></section><div class="stats"><div><strong>50</strong><span class="quiet">道情景题</span></div><div><strong>5–7</strong><span class="quiet">分钟预计用时</span></div><div><strong>5</strong><span class="quiet">观察维度</span></div></div><section class="card"><h2>五个观察维度</h2><div class="grid">'+d.labels.map((x,i)=>'<div class="tile" style="'+tone(i)+'"><i class="dot"></i><h3>'+x+'</h3><p>'+d.notes[i][0]+'</p></div>').join('')+'</div></section><section class="card"><h2>做完能看到什么？</h2><p>'+d.benefit+'</p><div class="grid"><div class="tile"><h3>总档位与单项分数</h3><p>低阶、中阶或高阶，以及五项各自的分数与表现。</p></div><div class="tile"><h3>优势与场景练习</h3><p>依据实际选择，看到做得好的部分、带来的好处，以及类似场景的其他做法。</p></div></div></section><section class="card center"><h2>按最近三个月的实际表现作答</h2><p class="quiet">选你通常最先会做的事。答案保存在当前浏览器，可随时回来继续。</p>'+startButton()+'</section>');
}
function quiz(focus=true){
  const q=d.questions[index];
  show('<div class="reader"><div class="row"><button class="secondary" data-action="home">← 首页</button><span class="quiet">已答 '+done()+'／50</span></div><div class="progress" role="progressbar" aria-label="已答题数" aria-valuemin="0" aria-valuemax="50" aria-valuenow="'+done()+'"><span style="width:'+done()*2+'%"></span></div><section class="card"><div class="kicker">第 '+(index+1)+'／50 题</div><h1 class="qhead" tabindex="-1">'+q[0]+'</h1>'+q.slice(1).map((x,j)=>'<button class="choice" data-option="'+j+'" aria-pressed="'+(answers[index]===j)+'"><span class="letter">'+('ABC'[j])+'</span><span>'+x+'</span></button>').join('')+'<div class="actions"><button class="secondary" data-action="back" '+(!index?'disabled':'')+'>上一题</button><button class="primary" data-action="next" '+(answers[index]===null?'disabled':'')+'>'+(index===49?'查看结果':'下一题 →')+'</button></div></section></div>',focus);
}
function summarize(){
  const scores=d.labels.map((_,g)=>answers.slice(g*10,g*10+10).reduce((sum,a,j)=>sum+score(g*10+j,a),0));
  const total=scores.reduce((a,b)=>a+b,0);
  const gate=d.kind==='intj'&&scores.some(n=>n<10);
  const stage=total<50?'低阶':total<75||gate?'中阶':'高阶';
  return {scores,total,stage,limited:total>=75&&gate};
}
const rank=n=>n<10?'低':n<15?'中':'高';
function feedback(i,g,positive){
  const [q,...options]=d.questions[i];
  const [,practice,alternative]=d.notes[g];
  const top=options.filter((_,a)=>score(i,a)===2&&a!==answers[i]);
  return '<div class="tile feedback"><h3>'+d.labels[g]+' · 第 '+(i+1)+' 题</h3><p>'+q+'</p><blockquote>你选择：'+options[answers[i]]+'</blockquote>'+(positive?'<p>值得肯定的是，你选择了一个可以直接落实的做法。'+d.notes[g][0]+'</p>':'<ul>'+(top.length?'<li>同场景可以试：'+top[0]+'</li>':'')+'<li>'+practice+'</li><li>'+alternative+'</li></ul>')+'</div>';
}
function result(){
  const {scores,total,stage,limited}=summarize();
  const groups=scores.map((_,i)=>i);
  const high=groups.slice().sort((a,b)=>scores[b]-scores[a]);
  const low=groups.slice().sort((a,b)=>scores[a]-scores[b]);
  const indices=g=>Array.from({length:10},(_,i)=>g*10+i);
  const good=high.map(g=>indices(g).find(i=>score(i)===2)).filter(i=>i!==undefined).slice(0,3);
  const grow=low.map(g=>indices(g).find(i=>score(i)===0)??indices(g).find(i=>score(i)===1)).filter(i=>i!==undefined).slice(0,2);
  const sub=d.kind==='intj'?'<section class="card"><h2>四种补充练习</h2><p class="quiet">每种用两题回顾具体做法。</p><div class="grid">'+[
    ['扩展备选（Ne 视角）',[40,44],'给原目标和活动形式各想一个备选。'],
    ['确认对方需要（Fe 视角）',[41,45],'解释前先问对方现在想谈什么。'],
    ['调用具体经验（Si 视角）',[42,46],'把上次漏掉的细节变成这次的提醒。'],
    ['检查逻辑与定义（Ti 视角）',[43,47],'一次只改一个条件，或先核对双方对同一个词的理解。']
  ].map(([label,ids,tip])=>'<div class="tile"><h3>'+label+' · '+ids.reduce((a,i)=>a+score(i),0)+'／4</h3><p>'+tip+'</p><p class="quiet">回顾第 '+ids.map(i=>i+1).join('、')+' 题</p></div>').join('')+'</div></section>':'';
  show('<section class="card overview"><div><h1 class="qhead" tabindex="-1">你的情景应对结果</h1><div class="total">'+total+' <small>／100</small></div><div class="pill">'+stage+'</div><p class="quiet">'+(limited?'总分已达高阶区间。待拓展维度：'+d.labels.filter((_,i)=>scores[i]<10).join('、')+'。':stage==='高阶'?'你在多类场景中展现了不同的应对做法。':stage==='中阶'?'你在一些场景会调整做法，有些场景更习惯用第一反应。':'先从一种容易尝试的新做法开始。')+'</p></div>'+graph(scores,total)+'</section><section class="card"><h2>五项分数</h2><p class="quiet">每项独立按 20 分计算。图形长度表示该项得分比例。</p>'+d.labels.map((x,i)=>'<div class="metric" style="'+tone(i)+'"><div class="row"><span><i class="dot"></i>'+x+'</span><strong>'+scores[i]+'／20 · '+rank(scores[i])+'</strong></div><div class="meter" aria-hidden="true"><i style="width:'+scores[i]*5+'%"></i></div></div>').join('')+'</section><section class="card"><h2>你已经做得好的地方</h2>'+(good.length?good.map(i=>feedback(i,Math.floor(i/10),true)).join(''):'<p>这次可以先从你得分最高的“'+d.labels[high[0]]+'”开始回顾。想一件类似的小事，看看原来的做法解决了什么。</p>')+'</section><section class="card"><h2>下一次还可以怎么做</h2>'+(grow.length?grow.map(i=>feedback(i,Math.floor(i/10),false)).join(''):'<p>你这次每题都选择了本问卷评分最高的做法。可以回想最近一次遇到类似情况时，你是在什么条件下做到的。</p>')+'</section>'+sub+'<div class="row end"><button class="secondary" data-action="home">返回首页</button><button class="secondary" data-action="restart">重新测试</button></div>',true);
}
app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const option=button.dataset.option;
  if(option!==undefined){
    answers[index]=Number(option);complete=false;save();
    app.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    const progress=app.querySelector('.progress');
    progress.setAttribute('aria-valuenow',done());progress.firstElementChild.style.width=done()*2+'%';
    app.querySelector('.reader > .row .quiet').textContent='已答 '+done()+'／50';
    app.querySelector('[data-action=next]').disabled=false;return;
  }
  switch(button.dataset.action){
    case 'home':home();break;
    case 'start':if(complete){result();break}index=done()===50?49:answers.indexOf(null);quiz();break;
    case 'back':if(index>0){index--;quiz()}break;
    case 'next':
      if(answers[index]===null)break;
      if(index<49){index++;quiz();break}
      if(done()<50){index=answers.indexOf(null);quiz();break}
      complete=true;save();result();break;
    case 'restart':
      if(!confirm('清除本次答案，重新开始？'))break;
      answers.fill(null);complete=false;index=0;save();quiz();break;
  }
});
home();
</script>
</body></html>
